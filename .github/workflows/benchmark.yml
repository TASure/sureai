# JMH 性能基准：手动触发或每月 1 号自动执行，产出基准结果作为 artifact 归档。
#
# 不进默认 CI 提交门禁（耗时长），仅按需运行：
#   - workflow_dispatch：Actions 页面手动触发
#   - schedule：每月 1 号 UTC 00:00
name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install project (parent pom + upstream modules)
        # -am 一并安装父 POM 与全部上游依赖，避免 sure-ai-benchmark 解析依赖时从 Central 找未发布的 SNAPSHOT/新版本
        run: mvn -B install -DskipTests -pl sure-ai-benchmark -am

      - name: Run JMH benchmark
        # -wi 1 -i 1：CI 内取最小预热/迭代，仅作趋势基线；结果写 JSON 便于后续对比
        run: mvn -B -pl sure-ai-benchmark exec:java@jmh-main -Dexec.args="-wi 1 -i 1 -bm avgt -rff target/benchmark-result.json -rf json"

      - name: Upload benchmark result
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-result
          path: sure-ai-benchmark/target/benchmark-result.json
