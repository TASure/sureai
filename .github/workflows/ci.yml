name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Windows 暂列为可选：Maven 路径分隔符/脚本行为尚未在 CI 全量验证，失败不阻断整体。
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        java: [25]
        os: [ubuntu-latest, macos-latest]
        include:
          # JDK25 额外覆盖 Windows（允许失败）
          - java: 25
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, test and verify
        # 覆盖率门禁（jacoco check）仅在 ubuntu 主环境执行；macos/windows 跳过
        # jacoco 插桩——不同 OS 的字节码/运行时探测差异会导致个别模块行探测差异
        # （如 OllamaClient 短报文路径）误报门禁失败，矩阵价值是验证测试跨环境
        # 通过，覆盖率由主环境统一把关。
        # 统一 shell: bash：windows 默认 pwsh 调用 mvn.cmd 时会把 -Dkey=value 参数
        # 拆成 "-Dkey" + "=value"（Unknown lifecycle phase），bash 无此问题。
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            mvn -B verify
          else
            mvn -B verify -Djacoco.skip=true
          fi

      - name: Upload JaCoCo coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report-${{ matrix.os }}-jdk${{ matrix.java }}
          path: sure-ai-*/target/site/jacoco/

  # OWASP dependency-check 依赖漏洞扫描：与 build 矩阵并行的独立 job。
  # - 仅 build 期插件（org.owasp:dependency-check-maven，挂在 -Psecurity profile），零运行期依赖变化；
  # - 不进默认 mvn verify（保主构建速度），本 job 显式以命令式 goal 调用；
  # - 需要联网拉取 NVD CVE 数据库（首次约数百 MB，GitHub Actions 允许出站）；
  # - continue-on-error: true：NVD 抖动或新披露 CVE 触发 failBuildOnCVSS=7 时，仅报告变红，
  #   不阻塞 build 矩阵门禁；报告以 artifact 归档供人工/后续门禁复核。基线稳定后可改为 false 以强制执行。
  dependency-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # sure-ai-all 依赖全部内部 SNAPSHOT 模块，必须先 install 到本地 .m2，
      # 后续在聚合点 -pl sure-ai-all 才能解析出完整依赖树（与 benchmark.yml 先 install 的先例一致）。
      - name: Install modules to local repository
        run: mvn -B -DskipTests -Dgpg.skip=true install

      # 缓存 NVD/CISA 数据库（~/.dependency-check）：首次冷启动约 60 分钟，
      # 命中后增量更新仅需 1-3 分钟；key 随依赖树变化失效，但 restore-keys 会回退到最近缓存增量更新。
      - name: Cache dependency-check data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml', '**/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: OWASP dependency-check
        # NVD_API_KEY 为仓库 Actions secret（NVD 官网激活后写入），注入 nvdApiKey 参数：
        # 带 key 可显著提高 NVD API 配额（50 req/30s），避免无 key 限流/失败；
        # 13.x 对缺失 key 直接报 Invalid API Key，故 secret 未配置时本 job 变红但不阻塞门禁（continue-on-error）。
        run: mvn -B -Psecurity -pl sure-ai-all dependency-check:check -Dgpg.skip=true -DnvdApiKey="${{ secrets.NVD_API_KEY }}"

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report
          path: sure-ai-all/target/dependency-check/
          if-no-files-found: warn

  # GraalVM native-image 真实编译验证：对 sure-ai-cli fat jar 做 AOT 编译 + 冒烟。
  # - 独立 job、不进主 CI 门槛：native 编译慢（5–10 分钟）且 GraalVM 版本更新频繁，
  #   continue-on-error: true 保证 GraalVM 抖动或元数据待补时不阻塞 build 矩阵门禁；
  # - 使用 graalvm/setup-graalvm@v1 官方 action：JDK 25 + graalvm-community 发行版 +
  #   components: native-image（自动安装 native-image 组件）+ Maven 缓存；
  # - fat jar 内 META-INF/native-image/ 各模块元数据（reflect-config / native-image.properties）
  #   由 native-image 构建器自动发现并合并，无需手动指定配置路径；
  # - 冒烟：`./sure-ai-cli list`——列出 23 个平台，纯本地、零网络、零 API key，
  #   验证 native 可执行文件能正常启动、类加载、静态初始化、record 访问器反射均正常。
  native:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up GraalVM JDK 25 + native-image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      # 打 fat jar：-am 连带构建 sure-ai-all 聚合的全部上游模块（core/rag/agent/mcp/各平台）。
      # -Dgpg.skip=true：package 阶段不触发 GPG 签名（CI 无签名密钥）。
      - name: Build fat jar
        run: mvn -B -DskipTests -Dgpg.skip=true package -pl sure-ai-cli -am

      # native-image 从 fat jar 编译：META-INF/native-image/ 下各模块元数据自动发现。
      # 输出到 sure-ai-cli/target/native-image/（避免与 sure-ai-cli/ 模块目录同名冲突）。
      - name: Native-image compile
        run: |
          mkdir -p sure-ai-cli/target/native-image
          # fat jar 动态定位（排除 original-/sources/javadoc 变体），避免版本号硬编码随 bump 失效
          JAR=$(ls sure-ai-cli/target/*.jar | grep -v -E 'original-|sources|javadoc' | head -1)
          echo "native-image input jar: $JAR"
          native-image -jar "$JAR" \
            -H:Name=sure-ai-cli -H:Path=sure-ai-cli/target/native-image

      # 冒烟：list 子命令零网络、零 API key，验证 native 二进制可启动 + ProviderRegistry
      # 静态初始化 + record 访问器（reflect-config.json 覆盖的 model record）正常工作。
      - name: Smoke test (list)
        run: ./sure-ai-cli/target/native-image/sure-ai-cli list
