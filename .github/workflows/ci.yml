name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Windows 暂列为可选：Maven 路径分隔符/脚本行为尚未在 CI 全量验证，失败不阻断整体。
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
        os: [ubuntu-latest, macos-latest]
        include:
          # JDK21 额外覆盖 Windows（允许失败）
          - java: 21
            os: windows-latest
        exclude:
          # JDK25 仅在 ubuntu 上验证，节省资源
          - java: 25
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, test and verify
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}-jdk${{ matrix.java }}
          path: sure-ai-*/target/site/jacoco/
