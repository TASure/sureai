# GraalVM native-image 编译建议（sure-ai-cli，native 编译入口）。
# CLI 是 native 可执行文件的入口模块：合并 fat jar 后，各平台 jar 自带的
# META-INF/native-image/<groupId>/<artifactId>/ 元数据会被 native-image 自动发现并合并。
# 这里继承 core 的字符集与协议参数；CLI 不加载 classpath 资源、不做 JSON 反射，无需 IncludeResources。
Args = -H:+AddAllCharsets --enable-url-protocols=https,http
